[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "knowledge-loom"
version = "0.1.1"
description = "Agent-neutral governance and skills for local Markdown knowledge vaults"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
knowledge-loom = "knowledge_loom.cli:main"

[project.urls]
Homepage = "https://github.com/magickaichen/knowledge-loom"
Repository = "https://github.com/magickaichen/knowledge-loom"
Issues = "https://github.com/magickaichen/knowledge-loom/issues"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
