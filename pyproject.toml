[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-loom"
version = "0.1.1"
description = "Agent-neutral governance and skills for local Markdown knowledge vaults"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
knowledge-loom = "knowledge_loom.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
