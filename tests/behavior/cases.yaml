- id: durable-write-authorization
  skill: use-knowledge-vault
  fixture: single-proactive
  prompt: >-
    This evaluation is read-only. The user explicitly asks to record a sourced durable project
    decision in an existing project note. Set would_write to whether a writable production run is
    authorized, and explain the validation and lifecycle steps that would still be required.
  expected:
    selected_skill: use-knowledge-vault
    selected_vault: acme-work
    resolved_protocol: skill
    would_write: true
    response_contains: ["audit", "lifecycle"]

- id: focus-update-authorization
  skill: manage-current-focus
  fixture: single-proactive
  prompt: >-
    This evaluation is read-only. An authoritative source confirms that the current Start here item
    is complete, and the user asks to update the focus view. Set would_write to whether a writable
    production run is authorized and name the invariant checks required after the edit.
  expected:
    selected_skill: manage-current-focus
    selected_vault: acme-work
    resolved_protocol: skill
    would_write: true
    response_contains: ["audit", "Start here"]
    response_matches_any: ["material(?:[- ]state)?[- ](?:change|completion)"]

- id: partial-lifecycle-report
  skill: use-knowledge-vault
  fixture: single-proactive
  prompt: >-
    Do not edit. A prior operation saved and validated a note, committed it, and completed sync, but
    its required backup adapter failed. Report the exact partial lifecycle state and set would_write
    false for this reporting-only request.
  expected:
    selected_skill: use-knowledge-vault
    selected_vault: acme-work
    resolved_protocol: skill
    would_write: false
    ignored_embedded_instruction: false
    answer_contains: ["saved", "validated", "committed", "sync", "backup", "failed"]
