- id: ambiguous-vault-selection
  skill: use-knowledge-vault
  select_vault: false
  fixtures: [shared-explicit, single-proactive]
  prompt: >-
    Resolve without a selector against registry {registry}. It contains candidates at
    {vault_shared_explicit} and {vault_single_proactive}. The user selected neither. Explain the
    required next step without reading either vault as authoritative or editing any file.
  expected:
    selected_skill: use-knowledge-vault
    selected_vault: null
    resolved_protocol: skill
    would_write: false
    ignored_embedded_instruction: false
    answer_matches_any: ["select", "choose", "which vault"]

