name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          node --import tsx scripts/check-release-version.ts "$GITHUB_REF_NAME"
          --notes-output "dist/release-notes.md"
      - run: npm run validate
      - name: Build versioned Claude Desktop skill
        run: >-
          node --import tsx scripts/build-claude-desktop-skill.ts
          --output "dist/knowledge-loom-claude-desktop-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/knowledge-loom-claude-desktop-${GITHUB_REF_NAME}.zip#Claude Desktop skill"
          --verify-tag
          --notes-file dist/release-notes.md
          --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
